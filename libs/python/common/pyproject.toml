[project]
name = "drastic-common"
version = "0.1.0"
description = "Shared tools for drastic-backup"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "croniter>=6.0.0",
    "marshmallow>=3.26.1",
    "pycryptodome>=3.23.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
drastic_common = ["build-version.txt", "build-revision.txt"]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "ruff>=0.14.9",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "B", "I"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["drastic_common"]
