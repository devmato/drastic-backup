services:
  agent:
    image: ${DRASTIC_AGENT_IMAGE:-ghcr.io/devmato/drastic-backup-agent:latest}
    restart: unless-stopped
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - ${DRASTIC_AGENT_HOST_DATA_PATH:-/opt/drastic-agent/data}:/app/data
      - ${DRASTIC_AGENT_HOST_ROOT_PATH:-/}:/mnt/host:ro
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      TZ: ${TZ:-UTC}
      DRASTIC_ENV: ${DRASTIC_ENV:-prod}
      DRASTIC_SERVER: ${DRASTIC_SERVER:-http://host.docker.internal:5050}
      DRASTIC_USER: ${DRASTIC_USER:-}
      DRASTIC_PASSWORD: ${DRASTIC_PASSWORD:-}
      DRASTIC_LOGLEVEL: ${DRASTIC_LOGLEVEL:-INFO}
      DRASTIC_PROXMOX_API_URL: ${DRASTIC_PROXMOX_API_URL:-}
      DRASTIC_PROXMOX_TOKEN_ID: ${DRASTIC_PROXMOX_TOKEN_ID:-}
      DRASTIC_PROXMOX_TOKEN_SECRET: ${DRASTIC_PROXMOX_TOKEN_SECRET:-}
      DRASTIC_PROXMOX_VERIFY_TLS: ${DRASTIC_PROXMOX_VERIFY_TLS:-}
      DRASTIC_PROXMOX_NODE: ${DRASTIC_PROXMOX_NODE:-}
      DRASTIC_COMMAND_TIMEOUT_SECONDS: ${DRASTIC_COMMAND_TIMEOUT_SECONDS:-60}
      DRASTIC_TASK_TIMEOUT_SECONDS: ${DRASTIC_TASK_TIMEOUT_SECONDS:-600}
      DRASTIC_RESTIC_TIMEOUT_SECONDS: ${DRASTIC_RESTIC_TIMEOUT_SECONDS:-86400}
      DRASTIC_AGENT_MAX_WORKERS: ${DRASTIC_AGENT_MAX_WORKERS:-2}
      DRASTIC_AGENT_MAX_PENDING: ${DRASTIC_AGENT_MAX_PENDING:-8}
