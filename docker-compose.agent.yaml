services:
  agent:
    image: ${DRASTIC_AGENT_IMAGE:-ghcr.io/devmato/drastic-backup-agent:latest}
    restart: unless-stopped
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - ${DRASTIC_AGENT_HOST_DATA_PATH:-/opt/drastic-agent/data}:/app/data
      - ${DRASTIC_AGENT_HOST_ROOT_PATH:-/}:/mnt/host:ro
      - /var/run/docker.sock:/var/run/docker.sock
    env_file:
      - path: .env
        required: false
