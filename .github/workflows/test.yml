name: Test

on:
  push:
    branches:
      - develop
      - main
  pull_request:
  workflow_dispatch:

jobs:
  python:
    name: Python ${{ matrix.component }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: backend
            workdir: apps/backend
            python-version: "3.13"
          - component: backend-py311
            workdir: apps/backend
            python-version: "3.11"
          - component: agent
            workdir: apps/agent
            python-version: "3.11"
          - component: common
            workdir: libs/python/common
            python-version: "3.11"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v7
      - name: Install dependencies
        working-directory: ${{ matrix.workdir }}
        run: uv sync --frozen --dev --python ${{ matrix.python-version }}
      - name: Install restic for integration test
        if: matrix.component == 'agent' || matrix.component == 'common'
        run: ./scripts/ci/install-restic.sh
      - name: Lint
        working-directory: ${{ matrix.workdir }}
        run: uv run --python ${{ matrix.python-version }} ruff check src tests
      - name: Test
        working-directory: ${{ matrix.workdir }}
        run: uv run --python ${{ matrix.python-version }} pytest

  migrations:
    name: MariaDB Migrations
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v7
      - name: Install dependencies
        working-directory: apps/backend
        run: uv sync --frozen --dev --python 3.13
      - name: Verify migration roundtrip
        working-directory: apps/backend
        run: ./scripts/test-migrations.sh

  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Install dependencies
        working-directory: apps/frontend
        run: corepack enable && yarn install --immutable
      - name: Build
        working-directory: apps/frontend
        run: yarn build

  docs:
    name: Documentation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Build docs
        run: |
          python -m pip install --upgrade pip
          python -m pip install mkdocs-material
          mkdocs build

  release-tooling:
    name: Release Tooling
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Check scripts
        run: |
          bash -n scripts/release.sh
          bash -n scripts/install-drastic-agent.sh
          python -m py_compile scripts/drastic-agent-installer.py
          bash -n scripts/generate-env.sh
          bash -n scripts/ci/publish-docker-image.sh
          bash -n scripts/ci/install-restic.sh
          bash -n apps/backend/scripts/test-migrations.sh
