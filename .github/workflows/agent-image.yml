name: Agent Image

on:
  push:
    branches:
      - develop
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Publish Agent Image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish image
        env:
          CONTAINER_REGISTRY: ghcr.io
          CONTAINER_IMAGE_NAMESPACE: devmato
          CONTAINER_USERNAME: ${{ github.actor }}
          CONTAINER_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/ci/publish-docker-image.sh drastic-backup-agent apps/agent/Dockerfile .
