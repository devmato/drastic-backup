name: Images

on:
  push:
    branches:
      - develop
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Publish ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: drastic-backup-server
            dockerfile: Dockerfile
          - image: drastic-backup-agent
            dockerfile: apps/agent/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Publish image
        env:
          IMAGE_NAME: ${{ matrix.image }}
          DOCKERFILE: ${{ matrix.dockerfile }}
          CONTAINER_REGISTRY: ghcr.io
          CONTAINER_IMAGE_NAMESPACE: devmato
          CONTAINER_PLATFORMS: linux/amd64,linux/arm64
          CONTAINER_USERNAME: ${{ github.actor }}
          CONTAINER_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/ci/publish-docker-image.sh "$IMAGE_NAME" "$DOCKERFILE" .
