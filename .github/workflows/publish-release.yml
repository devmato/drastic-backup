name: Publish Release

on:
  release:
    types: [published]

concurrency:
  group: release
  queue: max
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  publish:
    if: github.event.release.prerelease == false
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
      - uses: docker/setup-buildx-action@v4
      - name: Require successful preparation of this commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          revision=$(git rev-parse HEAD)
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/workflows/release.yml/runs?head_sha=$revision&status=success&event=workflow_dispatch&per_page=100" |
            jq -e --arg revision "$revision" 'any(.[].workflow_runs[]; .head_sha == $revision and .head_branch == "develop" and .event == "workflow_dispatch" and .conclusion == "success")' > /dev/null
      - name: Advance main and promote existing images
        env:
          TAG: ${{ github.event.release.tag_name }}
          CONTAINER_REGISTRY: ghcr.io
          CONTAINER_IMAGE_NAMESPACE: devmato
          CONTAINER_USERNAME: ${{ github.actor }}
          CONTAINER_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/ci/promote-release-images.sh "$TAG" --advance-main
