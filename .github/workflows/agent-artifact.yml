name: Agent Artifact

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: Version to package, defaults to VERSION
        required: false

permissions:
  contents: write

jobs:
  linux-x64:
    name: Linux x64 Agent Artifact
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v5
      - name: Build artifact
        run: |
          VERSION="${{ inputs.version }}"
          if [ -z "$VERSION" ] && [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            VERSION="$GITHUB_REF_NAME"
          fi
          scripts/build-agent-artifact.sh "$VERSION"
      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: drastic-agent-linux-amd64
          path: dist/drastic-agent-linux-amd64-*.tar.gz
      - name: Attach to GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/drastic-agent-linux-amd64-${{ github.ref_name }}.tar.gz
          generate_release_notes: true
