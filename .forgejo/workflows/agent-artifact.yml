name: Agent Artifact

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: Version to package, defaults to VERSION
        required: false

jobs:
  linux-x64:
    name: Linux x64 Agent Artifact
    runs-on: docker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v5
      - name: Build artifact
        run: |
          VERSION="${{ inputs.version }}"
          if [ -z "$VERSION" ] && [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            VERSION="$GITHUB_REF_NAME"
          fi
          scripts/build-agent-artifact.sh "$VERSION"
      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: drastic-agent-linux-amd64
          path: dist/drastic-agent-linux-amd64-*.tar.gz
      - name: Attach to Forgejo release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          FORGEJO_TOKEN: ${{ secrets.FORGEJO_TOKEN }}
          ASSET_PATH: dist/drastic-agent-linux-amd64-${{ github.ref_name }}.tar.gz
        run: scripts/ci/upload-forgejo-release-asset.py
