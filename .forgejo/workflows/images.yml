name: Images

on:
  push:
    branches:
      - develop
      - main
    tags:
      - "[0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]-*"
  workflow_dispatch:

concurrency:
  group: images
  cancel-in-progress: false

jobs:
  publish:
    name: Publish ${{ matrix.image }}
    runs-on: docker
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: drastic-backup-server
            dockerfile: Dockerfile
          - image: drastic-backup-agent
            dockerfile: apps/agent/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: https://github.com/docker/setup-buildx-action@v3
      - name: Publish image
        env:
          IMAGE_NAME: ${{ matrix.image }}
          DOCKERFILE: ${{ matrix.dockerfile }}
          CONTAINER_REGISTRY: ${{ vars.CONTAINER_REGISTRY }}
          CONTAINER_IMAGE_NAMESPACE: ${{ vars.CONTAINER_IMAGE_NAMESPACE }}
          CONTAINER_USERNAME: ${{ secrets.CONTAINER_USERNAME }}
          CONTAINER_PASSWORD: ${{ secrets.CONTAINER_PASSWORD }}
          FORGEJO_TOKEN: ${{ secrets.FORGEJO_TOKEN }}
        run: scripts/ci/publish-docker-image.sh "$IMAGE_NAME" "$DOCKERFILE" .

  promote:
    name: Promote Release Images
    needs: publish
    if: github.ref == 'refs/heads/main'
    runs-on: docker
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: https://github.com/docker/setup-buildx-action@v3
      - name: Verify current release and promote both images
        env:
          CONTAINER_REGISTRY: ${{ vars.CONTAINER_REGISTRY }}
          CONTAINER_IMAGE_NAMESPACE: ${{ vars.CONTAINER_IMAGE_NAMESPACE }}
          CONTAINER_USERNAME: ${{ secrets.CONTAINER_USERNAME }}
          CONTAINER_PASSWORD: ${{ secrets.CONTAINER_PASSWORD }}
          FORGEJO_TOKEN: ${{ secrets.FORGEJO_TOKEN }}
        run: bash scripts/ci/promote-release-images.sh "$(python3 libs/python/common/src/drastic_common/version.py)"
