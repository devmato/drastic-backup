name: Images

on:
  push:
    branches:
      - develop
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  publish:
    name: Publish ${{ matrix.image }}
    runs-on: docker
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: drastic-backup-server
            dockerfile: Dockerfile
          - image: drastic-backup-agent
            dockerfile: apps/agent/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - name: Publish image
        env:
          IMAGE_NAME: ${{ matrix.image }}
          DOCKERFILE: ${{ matrix.dockerfile }}
          CONTAINER_REGISTRY: ${{ vars.CONTAINER_REGISTRY }}
          CONTAINER_IMAGE_NAMESPACE: ${{ vars.CONTAINER_IMAGE_NAMESPACE }}
          CONTAINER_USERNAME: ${{ secrets.CONTAINER_USERNAME }}
          CONTAINER_PASSWORD: ${{ secrets.CONTAINER_PASSWORD }}
          FORGEJO_TOKEN: ${{ secrets.FORGEJO_TOKEN }}
        run: scripts/ci/publish-docker-image.sh "$IMAGE_NAME" "$DOCKERFILE" .
