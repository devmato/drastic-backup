name: Agent Image

on:
  push:
    branches:
      - develop
      - main
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  publish:
    name: Publish Agent Image
    runs-on: docker
    steps:
      - uses: actions/checkout@v4
      - name: Publish image
        env:
          CONTAINER_REGISTRY: ${{ vars.CONTAINER_REGISTRY }}
          CONTAINER_IMAGE_NAMESPACE: ${{ vars.CONTAINER_IMAGE_NAMESPACE }}
          CONTAINER_USERNAME: ${{ secrets.CONTAINER_USERNAME }}
          CONTAINER_PASSWORD: ${{ secrets.CONTAINER_PASSWORD }}
          FORGEJO_TOKEN: ${{ secrets.FORGEJO_TOKEN }}
        run: scripts/ci/publish-docker-image.sh drastic-backup-agent apps/agent/Dockerfile .
