services:
  agent:
    build:
      context: ./apps/agent
      dockerfile: Dockerfile.dev
      args:
        DRASTIC_DEV_UID: ${DRASTIC_DEV_UID:-1000}
        DRASTIC_DEV_GID: ${DRASTIC_DEV_GID:-1000}
    user: "${DRASTIC_DEV_UID:-1000}:${DRASTIC_DEV_GID:-1000}"
    group_add:
      - "${DRASTIC_DOCKER_GID:-999}"
    volumes:
      - .:/workspace
      - ./apps/agent/data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock
      - /:/mnt/host:ro
    environment:
      TZ: ${TZ:-UTC}
      HOME: /app/data/home
      DRASTIC_ENV: dev
      DRASTIC_AGENT_HOT_RELOAD: "1"
      DRASTIC_AGENT_HOT_RELOAD_DEBOUNCE_MS: ${DRASTIC_AGENT_HOT_RELOAD_DEBOUNCE_MS:-}
      DRASTIC_AGENT_REWRITE_MANAGED_REPO_URLS: "1"
      DRASTIC_AGENT_MAX_WORKERS: ${DRASTIC_AGENT_MAX_WORKERS:-}
      DRASTIC_AGENT_MAX_PENDING: ${DRASTIC_AGENT_MAX_PENDING:-}
      DRASTIC_CANCEL_WAIT_TIMEOUT_SECONDS: ${DRASTIC_CANCEL_WAIT_TIMEOUT_SECONDS:-}
      DRASTIC_COMMAND_TIMEOUT_SECONDS: ${DRASTIC_COMMAND_TIMEOUT_SECONDS:-}
      DRASTIC_TASK_TIMEOUT_SECONDS: ${DRASTIC_TASK_TIMEOUT_SECONDS:-}
      DRASTIC_RESTIC_TIMEOUT_SECONDS: ${DRASTIC_RESTIC_TIMEOUT_SECONDS:-}
      DRASTIC_LOGLEVEL: ${DRASTIC_LOGLEVEL:-}
      DRASTIC_SERVER: ${DRASTIC_SERVER:-http://backend:5050}
      DRASTIC_USER: ${DRASTIC_USER:-${DRASTIC_BOOTSTRAP_ADMIN_USERNAME:-${DRASTIC_DEV_SEED_ADMIN_USERNAME:-}}}
      DRASTIC_PASSWORD: ${DRASTIC_PASSWORD:-${DRASTIC_BOOTSTRAP_ADMIN_PASSWORD:-${DRASTIC_DEV_SEED_ADMIN_PASSWORD:-}}}
      DRASTIC_PROXMOX_API_URL: ${DRASTIC_PROXMOX_API_URL:-}
      DRASTIC_PROXMOX_TOKEN_ID: ${DRASTIC_PROXMOX_TOKEN_ID:-}
      DRASTIC_PROXMOX_TOKEN_SECRET: ${DRASTIC_PROXMOX_TOKEN_SECRET:-}
      DRASTIC_PROXMOX_VERIFY_TLS: ${DRASTIC_PROXMOX_VERIFY_TLS:-}
      DRASTIC_PROXMOX_NODE: ${DRASTIC_PROXMOX_NODE:-}
    depends_on:
      - backend
    working_dir: /workspace/apps/agent
    command: ["sh", "-c", "uv sync --frozen && sh run.sh"]
