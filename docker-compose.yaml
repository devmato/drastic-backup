services:
  db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      TZ: ${TZ:-UTC}
      MARIADB_RANDOM_ROOT_PASSWORD: "1"
      MARIADB_DATABASE: ${MARIADB_DATABASE:-drastic}
      MARIADB_USER: ${MARIADB_USER:-drastic}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:?MARIADB_PASSWORD is required}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes:
      - ${DRASTIC_HOST_DB_PATH:-/opt/drastic-server/db}:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h 127.0.0.1 -u$$MARIADB_USER -p$$MARIADB_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    image: ${DRASTIC_SERVER_IMAGE:?DRASTIC_SERVER_IMAGE is required}
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    ports:
      - "${DRASTIC_HOST_BACKEND_ADDRESS:-127.0.0.1}:${DRASTIC_HOST_BACKEND_PORT:-5050}:${DRASTIC_BIND_BACKEND_PORT:-5050}"
    depends_on:
      db:
        condition: service_healthy
      rest-server:
        condition: service_started
    volumes:
      - ${DRASTIC_REST_SERVER_STORAGE_PATH:-/opt/drastic-server/restic}:/data

  rest-server:
    image: restic/rest-server:${DRASTIC_REST_SERVER_VERSION:-0.13.0}
    restart: unless-stopped
    environment:
      TZ: ${TZ:-UTC}
      DATA_DIRECTORY: /data
      DISABLE_AUTHENTICATION: "1"
    volumes:
      - ${DRASTIC_REST_SERVER_STORAGE_PATH:-/opt/drastic-server/restic}:/data
