services:
  db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      TZ: ${TZ:-UTC}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?MARIADB_ROOT_PASSWORD is required}
      MARIADB_DATABASE: ${MARIADB_DATABASE:?MARIADB_DATABASE is required}
      MARIADB_USER: ${MARIADB_USER:?MARIADB_USER is required}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:?MARIADB_PASSWORD is required}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes:
      - ${DRASTIC_HOST_DB_PATH:-/opt/drastic-server/db}:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h 127.0.0.1 -u$$MARIADB_USER -p$$MARIADB_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    image: ${DRASTIC_SERVER_IMAGE:-ghcr.io/devmato/drastic-backup-server:latest}
    restart: unless-stopped
    environment:
      TZ: ${TZ:-UTC}
      DRASTIC_ENV: ${DRASTIC_ENV:-prod}
      DRASTIC_TESTING: ${DRASTIC_TESTING:-false}
      DRASTIC_AGENT_IMAGE: ${DRASTIC_AGENT_IMAGE:-ghcr.io/devmato/drastic-backup-agent:latest}
      DRASTIC_AGENT_RELEASE_BASE_URL: ${DRASTIC_AGENT_RELEASE_BASE_URL:-https://github.com}
      DRASTIC_AGENT_RELEASE_REPOSITORY: ${DRASTIC_AGENT_RELEASE_REPOSITORY:-devmato/drastic-backup}
      DRASTIC_AGENT_ARTIFACT_TAG: ${DRASTIC_AGENT_ARTIFACT_TAG:-}
      DRASTIC_AGENT_ARTIFACT_NAME_TEMPLATE: ${DRASTIC_AGENT_ARTIFACT_NAME_TEMPLATE:-drastic-agent-{os}-{arch}-{tag}.{ext}}
      DRASTIC_ASSET_CACHE_PATH: ${DRASTIC_ASSET_CACHE_PATH:-/opt/drastic-server/asset-cache}
      DRASTIC_APP_MASTER_SECRET: ${DRASTIC_APP_MASTER_SECRET:?DRASTIC_APP_MASTER_SECRET is required}
      DRASTIC_JWT_TOKEN_LOCATION: ${DRASTIC_JWT_TOKEN_LOCATION:-["cookies"]}
      DRASTIC_JWT_REFRESH_TOKEN_EXPIRES: ${DRASTIC_JWT_REFRESH_TOKEN_EXPIRES:-2592000}
      DRASTIC_JWT_SESSION_COOKIE: ${DRASTIC_JWT_SESSION_COOKIE:-false}
      DRASTIC_JWT_COOKIE_SECURE: ${DRASTIC_JWT_COOKIE_SECURE:-false}
      DRASTIC_JWT_COOKIE_SAMESITE: ${DRASTIC_JWT_COOKIE_SAMESITE:-Lax}
      DRASTIC_JWT_COOKIE_CSRF_PROTECT: ${DRASTIC_JWT_COOKIE_CSRF_PROTECT:-true}
      DRASTIC_JWT_REFRESH_COOKIE_PATH: ${DRASTIC_JWT_REFRESH_COOKIE_PATH:-/api/auth}
      DRASTIC_JWT_ACCESS_COOKIE_PATH: ${DRASTIC_JWT_ACCESS_COOKIE_PATH:-/}
      DRASTIC_JWT_COOKIE_DOMAIN: ${DRASTIC_JWT_COOKIE_DOMAIN:-}
      DRASTIC_SQLALCHEMY_DATABASE_URI: ${DRASTIC_SQLALCHEMY_DATABASE_URI:?DRASTIC_SQLALCHEMY_DATABASE_URI is required}
      DRASTIC_SQLALCHEMY_TRACK_MODIFICATIONS: ${DRASTIC_SQLALCHEMY_TRACK_MODIFICATIONS:-false}
      DRASTIC_SQLALCHEMY_ECHO: ${DRASTIC_SQLALCHEMY_ECHO:-false}
      DRASTIC_PUBLIC_URL: ${DRASTIC_PUBLIC_URL:-}
      DRASTIC_REST_SERVER_URL: ${DRASTIC_REST_SERVER_URL:-http://rest-server:8000}
      DRASTIC_REST_SERVER_DATA_DIRECTORY: /data
      DRASTIC_DOCS_SITE_PATH: ${DRASTIC_DOCS_SITE_PATH:-/app/docs-site}
      DRASTIC_HOST_BACKEND_PORT: ${DRASTIC_HOST_BACKEND_PORT:-5050}
      DRASTIC_BIND_BACKEND_PORT: ${DRASTIC_BIND_BACKEND_PORT:-5050}
      DRASTIC_GUNICORN_WORKERS: ${DRASTIC_GUNICORN_WORKERS:-1}
      DRASTIC_GUNICORN_THREADS: ${DRASTIC_GUNICORN_THREADS:-16}
      DRASTIC_GUNICORN_TIMEOUT: ${DRASTIC_GUNICORN_TIMEOUT:-300}
      DRASTIC_GUNICORN_GRACEFUL_TIMEOUT: ${DRASTIC_GUNICORN_GRACEFUL_TIMEOUT:-60}
      DRASTIC_GUNICORN_KEEPALIVE: ${DRASTIC_GUNICORN_KEEPALIVE:-5}
      DRASTIC_GUNICORN_LOG_LEVEL: ${DRASTIC_GUNICORN_LOG_LEVEL:-info}
      DRASTIC_REST_PROXY_TIMEOUT_SECONDS: ${DRASTIC_REST_PROXY_TIMEOUT_SECONDS:-300}
      DRASTIC_COMMAND_TIMEOUT_SECONDS: ${DRASTIC_COMMAND_TIMEOUT_SECONDS:-60}
      DRASTIC_TASK_TIMEOUT_SECONDS: ${DRASTIC_TASK_TIMEOUT_SECONDS:-600}
      DRASTIC_BOOTSTRAP_ADMIN_USERNAME: ${DRASTIC_BOOTSTRAP_ADMIN_USERNAME:-}
      DRASTIC_BOOTSTRAP_ADMIN_PASSWORD: ${DRASTIC_BOOTSTRAP_ADMIN_PASSWORD:-}
    ports:
      - "${DRASTIC_HOST_BACKEND_ADDRESS:-127.0.0.1}:${DRASTIC_HOST_BACKEND_PORT:-5050}:${DRASTIC_BIND_BACKEND_PORT:-5050}"
    depends_on:
      db:
        condition: service_healthy
      rest-server:
        condition: service_started
    volumes:
      - ${DRASTIC_REST_SERVER_STORAGE_PATH:-/opt/drastic-server/restic}:/data
      - ${DRASTIC_ASSET_CACHE_PATH:-/opt/drastic-server/asset-cache}:${DRASTIC_ASSET_CACHE_PATH:-/opt/drastic-server/asset-cache}

  rest-server:
    image: restic/rest-server:${DRASTIC_REST_SERVER_VERSION:-0.13.0}
    restart: unless-stopped
    environment:
      TZ: ${TZ:-UTC}
      DATA_DIRECTORY: /data
      DISABLE_AUTHENTICATION: "1"
    volumes:
      - ${DRASTIC_REST_SERVER_STORAGE_PATH:-/opt/drastic-server/restic}:/data
